<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catat Panen AI - Cengkudu 800 MDPL</title>
<style>
body{font-family:system-ui;background:#f6f5e9;padding:20px}
h1{font-size:22px;margin:10px 0}
p{color:#555}
#btn{background:#16a34a;color:#fff;border:none;padding:15px 25px;font-size:18px;border-radius:12px;width:100%}
#btn2{background:#fff;color:#333;border:1px solid #ccc;padding:10px;margin-top:10px;border-radius:8px;width:48%}
#btn3{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;padding:10px;margin-top:10px;border-radius:8px;width:48%;float:right}
#status{margin-top:15px;font-weight:bold;min-height:20px}
#hasil{margin-top:20px;background:#fff;padding:15px;border-radius:12px;min-height:100px}
small{display:block;margin-top:40px;color:#888}
.blok{color:#16a34a;font-weight:bold}
.item{border-bottom:1px solid #eee;padding:6px 0}
.del{color:red;float:right;border:none;background:none}
</style>
</head>
<body>
<h1>🌱 Catat Panen Kopi Cengkudu</h1>
<p>800 MDPL - Cengkudu Asli - Banyumas</p>
<button id="btn">🎙️ Rekam Panen Kopi</button>
<p id="status">Tap untuk mulai rekam</p>
<div id="hasil"></div>
<button id="btn2" onclick="exportWA()">📤 Export WA</button>
<button id="btn3" onclick="bersih()">🗑️ Bersihin</button>
<small>Catat Panen AI 2026 - Hari 5.1 Anti-Dobel</small>
<script>
let lagiRekam=false,lastTeks="",lastWaktu=0,totalKG=0;
let db=JSON.parse(localStorage.getItem('panen')||'[]');
db=db.filter(x=>x&&x.kg); localStorage.setItem('panen',JSON.stringify(db));
db.forEach(x=>{totalKG+=x.kg});
function jawaKeAngka(t){ t=t.toLowerCase(); const k={siji:1,loro:2,telu:3,papat:4,limo:5,nem:6,pitu:7,wolu:8,sanga:9,sepuluh:10}; for(let j in k){ if(t.includes(j)) return k[j]; } let m=t.match(/(\d+)\s*kilo/); return m?parseInt(m[1]):0; }
function blokParser(t){ t=t.toLowerCase(); let m=t.match(/blok\s*([a-e])/); if(m) return "BLOK "+m[1].toUpperCase(); if(t.includes("be")||t.includes("blok b")) return "BLOK B"; if(t.includes("blok a")) return "BLOK A"; if(t.includes("blok c")) return "BLOK C"; if(t.includes("blok d")) return "BLOK D"; if(t.includes("blok e")) return "BLOK E"; return "BLOK B"; }
function render(){ let h=`<b>Total: ${totalKG} KG dari ${db.length} catatan</b><hr>`; db.slice().reverse().forEach((d,i)=>{ let idx=db.length-1-i; h+=`<div class=item>${d.jam} - ${d.kg} KG <span class=blok>${d.blok}</span> <button class=del onclick="hapus(${idx})">x</button><br><small>${d.teks}</small></div>`; }); document.getElementById('hasil').innerHTML=h; }
function hapus(i){ if(confirm('Hapus?')){ totalKG-=db[i].kg; db.splice(i,1); localStorage.setItem('panen',JSON.stringify(db)); render(); } }
function bersih(){ if(confirm('Bersihin semua?')){ localStorage.clear(); db=[]; totalKG=0; render(); document.getElementById('status').textContent='Data bersih - 0 KG'; } }
function exportWA(){ let t=`Laporan Cengkudu ${new Date().toLocaleDateString('id-ID')} - Total ${totalKG} KG\n`; db.forEach(d=>{t+=`${d.jam} ${d.kg}KG ${d.blok}\n`;}); window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank'); }
const btn=document.getElementById('btn'); const status=document.getElementById('status');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){ status.textContent="Browser tidak support mic"; }
else{
 const rec=new SR(); rec.lang='id-ID'; rec.interimResults=false; rec.continuous=false;
 rec.onstart=()=>{ lagiRekam=true; btn.textContent="🔴 Lagi Rekam..."; status.textContent="Ngomong: limo kilo blok a"; };
 rec.onend=()=>{ btn.textContent="🎙️ Rekam Panen Kopi"; lagiRekam=false; };
 rec.onresult=(e)=>{
   let teks=e.results[0][0].transcript.trim(); let now=Date.now();
   if(teks==lastTeks && (now-lastWaktu)<4000){ status.textContent="Sudah kecatet - anti dobel ✅"; return; }
   let kg=jawaKeAngka(teks); let blok=blokParser(teks);
   if(kg==0){ status.textContent="Gak denger kilo - coba lagi"; return; }
   lastTeks=teks; lastWaktu=now;
   let data={kg:kg, blok:blok, teks:teks, jam:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};
   db.push(data); localStorage.setItem('panen',JSON.stringify(db)); totalKG+=kg; render();
   status.textContent=`${teks} => ${kg} KG ${blok}`; try{rec.stop();}catch(e){}
 };
 btn.onclick=()=>{ if(lagiRekam) return; rec.start(); };
}
render();
</script>
</body>
</html>
