<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catat Panen AI - Cengkudu 800 MDPL</title>
<style>
body{font-family:system-ui;background:#f6f5e9;padding:20px}
h1{font-size:22px;margin:10px 0}
p{color:#555}
#btn{background:#16a34a;color:#fff;border:none;padding:15px 25px;font-size:18px;border-radius:12px;width:100%}
#btn2{background:#fff;color:#333;border:1px solid #ccc;padding:10px;margin-top:10px;border-radius:8px;width:48%}
#btn3{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;padding:10px;margin-top:10px;border-radius:8px;width:48%;float:right}
#status{margin-top:15px;font-weight:bold;min-height:20px}
#hasil{margin-top:20px;background:#fff;padding:15px;border-radius:12px;min-height:100px}
small{display:block;margin-top:40px;color:#888}
.blok{color:#16a34a;font-weight:bold}
.item{border-bottom:1px solid #eee;padding:6px 0}
.del{color:red;float:right;border:none;background:none}
</style>
</head>
<body>
<h1>🌱 Catat Panen Kopi Cengkudu</h1>
<p>800 MDPL - Cengkudu Asli - Banyumas</p>
<button id="btn">🎙️ Rekam Panen Kopi</button>
<p id="status">Tap untuk mulai rekam</p>
<div id="hasil"></div>
<button id="btn2" onclick="exportWA()">📤 Export WA</button>
<button id="btn3" onclick="bersih()">🗑️ Bersihin</button>
<small>Catat Panen AI 2026 - Hari 5 - Offline First</small>
<script>
let lagiRekam=false;
let totalKG=0;
let db=JSON.parse(localStorage.getItem('panen')||'[]');
db=db.filter(x=>x && x.kg);
localStorage.setItem('panen',JSON.stringify(db));
if(db.length){ db.forEach(x=>{totalKG+=x.kg}); }
function jawaKeAngka(teks){ teks=teks.toLowerCase(); const kamus={siji:1,loro:2,telu:3,papat:4,limo:5,nem:6,pitu:7,wolu:8,sanga:9,sepuluh:10}; for(let k in kamus){ if(teks.includes(k)) return kamus[k]; } let m=teks.match(/(\d+)\s*kilo/); return m?parseInt(m[1]):0; }
function blokParser(teks){ teks=teks.toLowerCase(); let m=teks.match(/blok\s*([a-e]|be|de)/); if(!m) return "BLOK B"; let b=m[1].replace('be','b').replace('de','d').toUpperCase(); return "BLOK "+b; }
function render(){ let h=`<b>Total: ${totalKG} KG dari ${db.length} catatan</b><hr>`; db.slice().reverse().forEach((d,i)=>{ let idx=db.length-1-i; h+=`<div class=item>${d.jam} - ${d.kg} KG <span class=blok>${d.blok||'BLOK B'}</span> <button class=del onclick="hapus(${idx})">x</button><br><small>${d.teks}</small></div>`; }); document.getElementById('hasil').innerHTML=h; }
function hapus(i){ if(confirm('Hapus catatan ini?')){ totalKG-=db[i].kg; db.splice(i,1); localStorage.setItem('panen',JSON.stringify(db)); render(); } }
function bersih(){ if(confirm('Bersihin semua data?')){ localStorage.clear(); db=[]; totalKG=0; render(); status.textContent='Data bersih - 0 KG'; } }
function exportWA(){ let t=`Laporan Panen Cengkudu 800 MDPL - ${new Date().toLocaleDateString('id-ID')}\nTotal ${totalKG} KG dari ${db.length} catatan\n`; db.forEach(d=>{t+=`${d.jam} ${d.kg}KG ${d.blok}\n`;}); let url='https://wa.me/?text='+encodeURIComponent(t); window.open(url,'_blank'); }
const btn=document.getElementById('btn'); const status=document.getElementById('status'); const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition){ status.textContent="Browser tidak support mic"; } else{
 const rec=new SpeechRecognition(); rec.lang='id-ID';
 rec.onstart=()=>{ if(lagiRekam) return; lagiRekam=true; btn.textContent="🔴 Lagi Rekam..."; status.textContent="Ngomong: limo kilo blok be"; };
 rec.onend=()=>{ btn.textContent="🎙️ Rekam Panen Kopi"; setTimeout(()=>lagiRekam=false,2000); };
 rec.onresult=(e)=>{
   let teks=e.results[0][0].transcript; let kg=jawaKeAngka(teks); let blok=blokParser(teks);
   if(kg==0){ status.textContent="Gak kedengeran kilo-nya, coba lagi"; return; }
   if(lagiRekam && e.results[0].isFinal){ let data={kg:kg, blok:blok, teks:teks, jam:new Date().toLocaleTimeString('id-ID')}; db.push(data); localStorage.setItem('panen',JSON.stringify(db)); totalKG+=kg; render(); status.textContent=`Kamu bilang: ${teks} => ${kg} KG ${blok}`; }
 };
 btn.onclick=()=>{ if(lagiRekam) return; rec.start(); };
}
render();
</script>
</body>
</html>
